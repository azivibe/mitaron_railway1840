name: Build PS4 final reference PDF

on:
  push:
    branches:
      - chatgpt-ps4-final-reference-20260727
    paths:
      - 'study_pack/build_ps4_reference.py'
      - '.github/workflows/build_ps4_reference.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts and PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum poppler-utils
          fc-cache -f -v

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab matplotlib pillow pypdf

      - name: Normalize mathtext commands
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('study_pack/build_ps4_reference.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              r'\text{preferences and constraints}': r'\mathrm{preferences\;and\;constraints}',
              r'\text{choice/demand}': r'\mathrm{choice/demand}',
              r'\text{market clearing or frontier}': r'\mathrm{market\;clearing\;or\;frontier}',
              r'\text{price/welfare}': r'\mathrm{price/welfare}',
              r'\quad\text{at}\quad': r'\quad\mathrm{at}\quad',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build and validate PDF
        run: python study_pack/build_ps4_reference.py

      - name: Render PDF pages and make a contact sheet
        run: |
          rm -rf /tmp/ps4_pages
          mkdir -p /tmp/ps4_pages
          pdftoppm -jpeg -r 65 study_pack/output/finance_lectures_1_7_final_ps4_reference.pdf /tmp/ps4_pages/page
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          pages = sorted(Path('/tmp/ps4_pages').glob('page-*.jpg'))
          if not pages:
              raise RuntimeError('No rendered pages')
          thumbs = []
          for i, path in enumerate(pages, 1):
              im = Image.open(path).convert('RGB')
              im.thumbnail((330, 470))
              canvas = Image.new('RGB', (350, 510), 'white')
              x = (350 - im.width) // 2
              y = 18
              canvas.paste(im, (x, y))
              d = ImageDraw.Draw(canvas)
              d.text((12, 486), f'Page {i}', fill='black')
              canvas = ImageOps.expand(canvas, border=1, fill='#cccccc')
              thumbs.append(canvas)
          cols = 4
          rows = (len(thumbs) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * 352, rows * 512), '#eeeeee')
          for idx, im in enumerate(thumbs):
              sheet.paste(im, ((idx % cols) * 352, (idx // cols) * 512))
          out = Path('study_pack/output/contact_sheet.jpg')
          sheet.save(out, quality=88, optimize=True)
          first = Image.open(pages[0]).convert('RGB')
          first.save('study_pack/output/preview_page_1.jpg', quality=90, optimize=True)
          print(f'Contact sheet created from {len(pages)} pages')
          PY

      - name: Commit generated PDF and previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add study_pack/output/finance_lectures_1_7_final_ps4_reference.pdf \
                  study_pack/output/contact_sheet.jpg \
                  study_pack/output/preview_page_1.jpg \
                  study_pack/output/manifest.txt
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Build finance lectures 1-7 PS4 final reference PDF'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
