name: Build official MBF problem guide

on:
  pull_request:
    branches: [main]
    paths:
      - 'study_pack/official_ps/**/*.typ'
      - '.github/workflows/build-official-ps.yml'
  workflow_dispatch:

concurrency:
  group: official-mbf-ps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk zip

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Compile PDFs
        run: |
          mkdir -p study_pack/output
          # Normalize helper identifiers and make every included module self-contained.
          sed -i \
            -e 's/show-solutions/show_solutions/g' \
            -e 's/maybe-solution/maybe_solution/g' \
            -e 's/maybe-key/maybe_key/g' \
            -e 's/maybe-caution/maybe_caution/g' \
            study_pack/official_ps/content.typ \
            study_pack/official_ps/ps1.typ \
            study_pack/official_ps/ps2.typ \
            study_pack/official_ps/ps3.typ \
            study_pack/official_ps/ps4.typ
          printf '%s\n' \
            '' \
            '#let show_solutions = sys.inputs.at("solutions") == "true"' \
            '#let maybe_solution(title, body) = if show_solutions { solution(title, body) } else { none }' \
            '#let maybe_key(body) = if show_solutions { key(body) } else { none }' \
            '#let maybe_caution(body) = if show_solutions { caution(body) } else { none }' \
            >> study_pack/official_ps/style.typ
          for f in content.typ ps1.typ ps2.typ ps3.typ ps4.typ; do
            sed -i '1i #import "style.typ": *' "study_pack/official_ps/${f}"
          done
          set +e
          {
            echo '=== Detailed edition ==='
            typst compile --input solutions=true study_pack/official_ps/content.typ study_pack/output/MBF_PS1-PS4_Official_Problems_Detailed_Solutions_KO.pdf
            STATUS_DETAILED=$?
            echo "Detailed status: ${STATUS_DETAILED}"
            echo
            echo '=== Problems-only edition ==='
            typst compile --input solutions=false study_pack/official_ps/content.typ study_pack/output/MBF_PS1-PS4_Official_Problems_Only_KO.pdf
            STATUS_PROBLEMS=$?
            echo "Problems-only status: ${STATUS_PROBLEMS}"
          } 2>&1 | tee study_pack/official_ps/typst-compile.log
          cp study_pack/official_ps/typst-compile.log study_pack/output/typst-compile.log
          if [ -f study_pack/output/MBF_PS1-PS4_Official_Problems_Detailed_Solutions_KO.pdf ] && [ -f study_pack/output/MBF_PS1-PS4_Official_Problems_Only_KO.pdf ]; then
            cd study_pack/output
            zip -j MBF_PS1-PS4_Official_Set_KO.zip \
              MBF_PS1-PS4_Official_Problems_Detailed_Solutions_KO.pdf \
              MBF_PS1-PS4_Official_Problems_Only_KO.pdf
          fi
          exit 0

      - name: Commit generated files and compile log
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f study_pack/official_ps/typst-compile.log
          for f in \
            study_pack/output/MBF_PS1-PS4_Official_Problems_Detailed_Solutions_KO.pdf \
            study_pack/output/MBF_PS1-PS4_Official_Problems_Only_KO.pdf \
            study_pack/output/MBF_PS1-PS4_Official_Set_KO.zip; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Build official MBF PS1-PS4 study PDFs'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Upload PDF bundle and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MBF_PS1-PS4_Official_Set_KO
          path: |
            study_pack/output/MBF_PS1-PS4_Official_Problems_Detailed_Solutions_KO.pdf
            study_pack/output/MBF_PS1-PS4_Official_Problems_Only_KO.pdf
            study_pack/output/MBF_PS1-PS4_Official_Set_KO.zip
            study_pack/output/typst-compile.log
          if-no-files-found: warn
